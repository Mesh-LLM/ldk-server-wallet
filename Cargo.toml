[package]
name = "mesh-wallet-ldk-server"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
description = "LDK Server wallet plugin for mesh-llm (wallet.v1), external plugin and reusable library"
repository = "https://github.com/benthecarman/ldk-server-wallet"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
# Not on crates.io; pinned to a reviewed commit.
ldk-server-client = { git = "https://github.com/lightningdevkit/ldk-server", rev = "08316de8795a759eee08dc3873d32f980fbd0fe0" }
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "60697c61755b7280c22d3ab9d9bcf5b663e8ae3b" }
mesh-llm-wallet = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "60697c61755b7280c22d3ab9d9bcf5b663e8ae3b", features = ["plugin-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
bitcoin = { version = "0.32", features = ["secp-recovery"] }
flate2 = "1"
lightning-invoice = { version = "0.35.0-rc1", features = ["std"] }
mesh-llm-plugin-manager = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "60697c61755b7280c22d3ab9d9bcf5b663e8ae3b" }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[[bin]]
name = "ldk-server-wallet"
path = "src/main.rs"
